name: Build and Deploy Documentation

concurrency:
  group: pychum-docs
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

jobs:
  build_docs:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra doc

      - name: Install Emacs 30
        uses: purcell/setup-emacs@master
        with:
          version: "30.1"

      - name: Export org to RST
        run: emacs --batch --load export.el
        working-directory: docs

      - name: Build docs
        run: uv run sphinx-build docs/source/ docs/build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/build

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.repository == 'HaoZeke/pychum'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/build --project-name=pychum-docs --branch=main
